<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Select File</title>
        <link href="picker.css" rel="stylesheet" />
    </head>
    <body>
        <h2 class="ts-pane-title">Upload Your File</h2>
        <p class="ts-pane-desc">Choose your local background image.</p>
        <label class="ts-btn-file" for="input-upload-file">
            <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span>Upload Local File</span>
            <input
                type="file"
                id="input-upload-file"
                accept="image/*"
                style="display: none"
            />
        </label>

        <script src="picker.js"></script>
    </body>
</html>
